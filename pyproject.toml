[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lvxml"
version = "1.0.0"
description = "Codec for LabVIEW Flatten To XML / Unflatten From XML between its fixed schema and native Python values"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Javier Lianes", email = "javier@lianes8studio.com" }]
keywords = ["labview", "xml", "flatten to xml", "unflatten from xml", "codec", "ni", "lvdata"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
# lxml validates fixtures against LabVIEW's XSD in the tests; hatchling lets the end-to-end
# test install the package in editable mode without network access (with editables).
dev = ["ruff", "mypy", "pytest", "build", "twine", "lxml", "hatchling", "editables"]

[project.scripts]
lvxml = "lvxml._cli:main"

[project.urls]
Homepage = "https://lianes8studio.com"
Source = "https://github.com/JaviLianes8/lvxml"
Issues = "https://github.com/JaviLianes8/lvxml/issues"
Changelog = "https://github.com/JaviLianes8/lvxml/blob/main/CHANGELOG.md"
LinkedIn = "https://www.linkedin.com/in/jlianes/"
Funding = "https://buymeacoffee.com/jlianesglrs"

[tool.hatch.build.targets.wheel]
packages = ["src/lvxml"]

[tool.hatch.build.targets.sdist]
only-include = [
    "src/lvxml",
    "tests",
    "scripts/capture_ni.py",
    "scripts/capture-labview-xml.ps1",
    "scripts/make_labview_jobs.py",
    "GUIDE.md",
    "README.md",
    "CHANGELOG.md",
    "CONTRIBUTING.md",
    "LICENSE",
    "pyproject.toml",
]
# NI's schema is a local test reference only: it is never distributed, only its manifest is.
exclude = ["**/__pycache__", "**/*.pyc", "tests/fixtures/ni/*.xsd"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true

# lxml ships no type information; it is only used by the tests to read LabVIEW's XSD.
[[tool.mypy.overrides]]
module = ["lxml", "lxml.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
