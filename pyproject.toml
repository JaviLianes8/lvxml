[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lvxml"
version = "0.2.0"
description = "Codec for LabVIEW Flatten To XML / Unflatten From XML between its fixed schema and native Python values"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Javier Lianes", email = "javier@lianes8studio.com" }]
keywords = ["labview", "xml", "codec", "flatten", "unflatten", "ni"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Programming Language :: Python :: 3",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
# lxml validates fixtures against LabVIEW's XSD in the tests; hatchling lets the end-to-end
# test install the package in editable mode without network access (with editables).
dev = ["ruff", "mypy", "pytest", "build", "twine", "lxml", "hatchling", "editables"]

[project.scripts]
lvxml = "lvxml._cli:main"

[project.urls]
Homepage = "https://lianes8studio.com"
Repository = "https://github.com/JaviLianes8/lvxml"
Issues = "https://github.com/JaviLianes8/lvxml/issues"
Changelog = "https://github.com/JaviLianes8/lvxml/blob/main/CHANGELOG.md"
LinkedIn = "https://www.linkedin.com/in/jlianes/"
Funding = "https://buymeacoffee.com/jlianesglrs"

[tool.hatch.build.targets.wheel]
packages = ["src/lvxml"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
